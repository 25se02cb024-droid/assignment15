<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
</head>

<body>

    <h1>Student Details</h1>

    <table border="1" id="studentTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>20</td>
            <td>BCA</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>21</td>
            <td>BCA</td>
        </tr>
    </table>

    <br>

    <button onclick="addStudent()">Add Student</button>

    <script>
        function addStudent() {

            let table = document.getElementById("studentTable");

            let row = table.insertRow();

            row.insertCell(0).textContent = "nishika";
            row.insertCell(1).textContent = "18";
            row.insertCell(2).textContent = "Btech";
        }
    </script>

</body>
</html>
